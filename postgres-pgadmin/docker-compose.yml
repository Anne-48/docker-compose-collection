name: postgres-pgadmin
services:
  postgres:
    container_name: local-postgres
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-dbLocal}
    volumes:
      - ./data/postgresql:/var/lib/postgresql
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - adgres-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dbLocal}',
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin4:
    container_name: local-pgadmin4
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    ports:
      - ${PGADMIN_PORT:-8080}:80
    networks:
      - adgres-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    configs:
      - source: pgadmin4-server-config
        target: /pgadmin4/servers.json

configs:
  pgadmin4-server-config:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Postgres Local",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "dbLocal",
            "Username": "postgres",
            "SSLMode": "prefer"
          }
        }
      }

networks:
  adgres-network:
    driver: bridge
